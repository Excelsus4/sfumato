<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="Sfumato v2.2 Dual-Track Architecture Diagram">
  <defs>
    <linearGradient id="bgArch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#EFE6D5"/>
    </linearGradient>
    <marker id="arrowSepia" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6A5B4B"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B83B2A"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2F5D62"/>
    </marker>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2B2118" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Parchment Background & Codex Double Frame -->
  <rect x="0" y="0" width="1120" height="430" rx="10" fill="url(#bgArch)"/>
  <rect x="12" y="12" width="1096" height="406" rx="6" fill="none" stroke="#C9B99B" stroke-width="1.5"/>
  <rect x="17" y="17" width="1086" height="396" rx="4" fill="none" stroke="#DED2BC" stroke-width="0.8"/>

  <!-- Subtle Codex Corner Ornaments -->
  <g stroke="#B8A482" stroke-width="1" fill="none" opacity="0.8">
    <path d="M24,36 L24,24 L36,24"/>
    <path d="M1096,36 L1096,24 L1084,24"/>
    <path d="M24,394 L24,406 L36,406"/>
    <path d="M1096,394 L1096,406 L1084,406"/>
  </g>

  <!-- Header -->
  <text x="44" y="49" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#2B2118">
    Sfumato v2.2 Architecture: Dissolving Domain Boundaries Without Losing Floor Quality
  </text>
  <text x="44" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="12.2" fill="#635647">
    Polarity-aware code RNG · Zero cross-talk Stage 1 · Shared-skeleton Blind masking · Clean-context Red-Team Triage &amp; Selective Hardening
  </text>

  <!-- Stage Labels -->
  <g font-family="system-ui, sans-serif" font-size="10.2" font-weight="700" fill="#8C7B65" letter-spacing="0.9">
    <text x="104" y="102" text-anchor="middle">INPUT</text>
    <text x="394" y="102" text-anchor="middle">STAGE 1 · ISOLATED PARALLEL DIVERGENCE</text>
    <text x="698" y="102" text-anchor="middle">STAGE 2a · TRIAGE</text>
    <text x="876" y="102" text-anchor="middle">STAGE 2b · HARDEN</text>
    <text x="1032" y="102" text-anchor="middle">OUTPUT</text>
  </g>

  <!-- INPUT BOX -->
  <g transform="translate(34, 178)">
    <rect x="0" y="0" width="140" height="128" rx="7" fill="#FFFDF8" stroke="#8C7B65" stroke-width="1.6" filter="url(#cardShadow)"/>
    <text x="70" y="27" font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#2B2118" text-anchor="middle">Hard Problem</text>
    <line x1="16" y1="37" x2="124" y2="37" stroke="#E3D8C5" stroke-width="1"/>
    <text x="70" y="56" font-family="system-ui, sans-serif" font-size="10.8" fill="#4E4235" text-anchor="middle">• Core Goal</text>
    <text x="70" y="74" font-family="system-ui, sans-serif" font-size="10.8" fill="#4E4235" text-anchor="middle">• Polarity &amp; Limits</text>
    <text x="70" y="92" font-family="system-ui, sans-serif" font-size="10.8" fill="#4E4235" text-anchor="middle">• Banned Clichés</text>
    <text x="70" y="112" font-family="system-ui, sans-serif" font-size="10.2" font-weight="600" fill="#2F5D62" text-anchor="middle">{USER_LANGUAGE}</text>
  </g>

  <!-- STAGE 1: Track A (Explicit) -->
  <g transform="translate(216, 114)">
    <rect x="0" y="0" width="356" height="80" rx="7" fill="#F2F7F7" stroke="#2F5D62" stroke-width="1.6" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="8" height="80" rx="3" fill="#2F5D62"/>
    <text x="20" y="24" font-family="Georgia, serif" font-size="13.2" font-weight="bold" fill="#1F4246">Track A · Explicit Analogy (High Hit-Rate)</text>
    <text x="20" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#354F52">Original brief + polarity-aware stratified code RNG</text>
    <text x="20" y="63" font-family="system-ui, sans-serif" font-size="10.6" fill="#527073">→ Surgical structural transfer without hint priming</text>
  </g>

  <!-- STAGE 1: Track B (Blind Isomorphic Masking) -->
  <g transform="translate(216, 208)">
    <rect x="0" y="0" width="356" height="106" rx="7" fill="#FDF5F3" stroke="#B83B2A" stroke-width="1.8" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="8" height="106" rx="3" fill="#B83B2A"/>
    <text x="20" y="23" font-family="Georgia, serif" font-size="12.6" font-weight="bold" fill="#8E281B">Track B · Blind Isomorphic Masking (Max Ceiling)</text>
    <text x="20" y="43" font-family="system-ui, sans-serif" font-size="10.8" fill="#4A2A25">1. Share 1 private 3-line skeleton (cost-bearer &amp; polarity)</text>
    <text x="20" y="61" font-family="system-ui, sans-serif" font-size="10.8" fill="#4A2A25">2. Fold limits into native scenario + whole-prompt reread</text>
    <text x="20" y="79" font-family="system-ui, sans-serif" font-size="10.8" fill="#4A2A25">3. Isolated blind solver runs with zero original terms</text>
    <text x="20" y="96" font-family="system-ui, sans-serif" font-size="10.8" font-weight="600" fill="#B83B2A">4. Back-translate mechanism only (drop weak fits)</text>
  </g>

  <!-- STAGE 1: Direct Anchor -->
  <g transform="translate(216, 328)">
    <rect x="0" y="0" width="356" height="62" rx="7" fill="#F4F3F0" stroke="#7A7F84" stroke-width="1.4" stroke-dasharray="5,3"/>
    <rect x="0" y="0" width="8" height="62" rx="3" fill="#7A7F84"/>
    <text x="20" y="24" font-family="Georgia, serif" font-size="12.8" font-weight="bold" fill="#44484C">Direct Anchor (Default · Floor Guarantee)</text>
    <text x="20" y="44" font-family="system-ui, sans-serif" font-size="10.8" fill="#5F6469">1 isolated baseline solver locks max(Direct, A, B) ≥ Direct</text>
  </g>

  <!-- STAGE 2a: Clean-Context Red-Team Triage -->
  <g transform="translate(616, 152)">
    <rect x="0" y="0" width="164" height="184" rx="7" fill="#FFFDF8" stroke="#3E2F23" stroke-width="1.8" filter="url(#cardShadow)"/>
    <text x="82" y="26" font-family="Georgia, serif" font-size="13.2" font-weight="bold" fill="#2B2118" text-anchor="middle">Clean-Context</text>
    <text x="82" y="43" font-family="Georgia, serif" font-size="13.2" font-weight="bold" fill="#B83B2A" text-anchor="middle">Red-Team Triage</text>
    <line x1="16" y1="53" x2="148" y2="53" stroke="#DED2BC" stroke-width="1"/>
    <text x="82" y="71" font-family="system-ui, sans-serif" font-size="10.3" fill="#635647" text-anchor="middle">Anonymized pool</text>
    <text x="16" y="94" font-family="system-ui, sans-serif" font-size="10.5" fill="#8E281B">✕ KILL: Jargon / Exploit</text>
    <text x="16" y="113" font-family="system-ui, sans-serif" font-size="10.5" fill="#8E281B">✕ KILL: Adverse Select.</text>
    <text x="16" y="132" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#B85D19">▲ HARDEN: Fixable gem</text>
    <text x="16" y="151" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2F5D62">✓ PASS: Ready as-is</text>
    <text x="16" y="172" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2B2118">★ Rank Top-1 + #2–#3</text>
  </g>

  <!-- STAGE 2b: Selective Hardening -->
  <g transform="translate(808, 174)">
    <rect x="0" y="0" width="136" height="140" rx="7" fill="#FBF5EA" stroke="#B85D19" stroke-width="1.6" filter="url(#cardShadow)"/>
    <text x="68" y="25" font-family="Georgia, serif" font-size="12.8" font-weight="bold" fill="#7A3C0D" text-anchor="middle">Selective</text>
    <text x="68" y="42" font-family="Georgia, serif" font-size="12.8" font-weight="bold" fill="#7A3C0D" text-anchor="middle">Hardening</text>
    <line x1="14" y1="52" x2="122" y2="52" stroke="#E2CFB2" stroke-width="1"/>
    <text x="68" y="72" font-family="system-ui, sans-serif" font-size="10.2" fill="#4E3A22" text-anchor="middle">Top-1 winner only</text>
    <text x="68" y="90" font-family="system-ui, sans-serif" font-size="10.2" fill="#4E3A22" text-anchor="middle">Patch 1 diagnosed flaw</text>
    <text x="68" y="108" font-family="system-ui, sans-serif" font-size="10.2" fill="#4E3A22" text-anchor="middle">Optional 1-primitive graft</text>
    <text x="68" y="127" font-family="system-ui, sans-serif" font-size="9.8" font-weight="600" fill="#8E281B" text-anchor="middle">No forced anchor override</text>
  </g>

  <!-- OUTPUT BOX -->
  <g transform="translate(974, 178)">
    <rect x="0" y="0" width="114" height="132" rx="7" fill="#B83B2A" filter="url(#cardShadow)"/>
    <text x="57" y="29" font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#FAF6EE" text-anchor="middle">Hardened</text>
    <text x="57" y="47" font-family="Georgia, serif" font-size="13.5" font-weight="bold" fill="#FAF6EE" text-anchor="middle">Top-1 Spec</text>
    <line x1="16" y1="58" x2="98" y2="58" stroke="#D97B6E" stroke-width="1"/>
    <text x="57" y="78" font-family="system-ui, sans-serif" font-size="10.4" fill="#FAEBE8" text-anchor="middle">+ 2 Runners-Up</text>
    <text x="57" y="96" font-family="system-ui, sans-serif" font-size="10.4" fill="#FAEBE8" text-anchor="middle">+ 1 Wildcard</text>
    <text x="57" y="115" font-family="system-ui, sans-serif" font-size="9.8" fill="#F5D3CE" text-anchor="middle">Red-Team Notes</text>
  </g>

  <!-- Connecting Arrows: Input -> Stage 1 -->
  <path d="M174,220 C196,220 196,154 212,154" fill="none" stroke="#2F5D62" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
  <path d="M174,242 L212,256" fill="none" stroke="#B83B2A" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <path d="M174,264 C196,264 196,359 212,359" fill="none" stroke="#7A7F84" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowSepia)"/>

  <!-- Connecting Arrows: Stage 1 -> Stage 2a -->
  <path d="M572,154 C594,154 594,212 612,212" fill="none" stroke="#2F5D62" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
  <path d="M572,260 L612,250" fill="none" stroke="#B83B2A" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <path d="M572,359 C594,359 594,290 612,290" fill="none" stroke="#7A7F84" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowSepia)"/>

  <!-- Connecting Arrow: Stage 2a -> Stage 2b -> Output -->
  <line x1="780" y1="244" x2="804" y2="244" stroke="#B83B2A" stroke-width="1.9" marker-end="url(#arrowRed)"/>
  <line x1="944" y1="244" x2="970" y2="244" stroke="#B83B2A" stroke-width="1.9" marker-end="url(#arrowRed)"/>
</svg>
